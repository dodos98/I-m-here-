<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover: يجعل الصفحة تملأ الشاشة كاملة على الجوال -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>أنا هنا</title>

<style>
/* ============================================================
   1) الألوان (Design tokens)
   كل الألوان متغيرات هنا، فتغييرها من مكان واحد.
   الوضع الداكن يُفعَّل تلقائياً حسب إعدادات جهاز المستخدم.
   ============================================================ */
:root{
  --bg:#eaf0f7;          /* لون الخلفية */
  --fg:#12172b;          /* لون النص */
  --muted:#5d6785;       /* نص ثانوي */
  --card:rgba(255,255,255,.84); /* خلفية البطاقة (شبه شفافة) */
  --a:#4f46e5;           /* اللون الأساسي 1 */
  --b:#06b6d4;           /* اللون الأساسي 2 (للتدرج) */
  --ok:#15803d;          /* نجاح */
  --err:#dc2626;         /* خطأ */
  /* ألوان رسم الخريطة التزيينية */
  --land:#eef2f7; --park:#cfe9d4; --water:#bfdcf5; --road:#ffffff; --road2:#d9e1ec;
  box-sizing:border-box;
  /* مسافات آمنة لشاشات الآيفون ذات النوتش */
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0b0f1d; --fg:#eef0fa; --muted:#a3abc9; --card:rgba(20,25,48,.8);
    --a:#6366f1; --b:#22d3ee; --ok:#4ade80; --err:#f87171;
    --land:#141a2e; --park:#17302a; --water:#16304d; --road:#2a3350; --road2:#222a44;
  }
}

/* ============================================================
   2) التخطيط العام
   ============================================================ */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--fg);
  font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:64px 20px 28px; text-align:center; overflow-y:auto;
}
/* الخريطة التزيينية الخلفية: ثابتة ولا تستقبل اللمس */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
/* طبقة تدرج تُخفي أطراف الخريطة كي لا تؤثر على قراءة المحتوى */
body::before{
  content:""; position:fixed; inset:0; z-index:1; pointer-events:none;
  background:radial-gradient(circle at 50% 45%,transparent 0,var(--bg) 85%); opacity:.55;
}
main{
  position:relative; z-index:2; margin:auto 0; width:100%; max-width:380px;
  display:flex; flex-direction:column; align-items:center; gap:20px;
}

/* ============================================================
   3) أزرار اختيار اللغة (أعلى الصفحة)
   inset-inline-end تعمل مع RTL و LTR تلقائياً
   ============================================================ */
.langs{
  position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); inset-inline-end:14px;
  display:flex; gap:4px; background:var(--card);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-radius:999px; padding:4px; z-index:5;
}
.langs button{border:0;background:transparent;color:var(--fg);padding:6px 12px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer}
.langs button.on{background:var(--a);color:#fff}

h1{
  font-size:1rem; font-weight:600; margin:0; background:var(--card);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  padding:8px 16px; border-radius:999px;
}

/* ============================================================
   4) الزر الرئيسي «أنا هنا» + حلقات النبض
   ============================================================ */
.wrap{width:190px;height:190px;display:grid;place-items:center;transition:transform .3s}
.wrap>*{grid-area:1/1}  /* كل العناصر فوق بعضها في نفس الخلية */
.pulse{
  width:190px;height:190px;border-radius:50%;
  background:linear-gradient(135deg,var(--a),var(--b));
  opacity:.25; animation:p 2.4s ease-out infinite;
}
.pulse.two{animation-delay:1.2s}
@keyframes p{0%{transform:scale(.7);opacity:.35}100%{transform:scale(1.25);opacity:0}}
#btn{
  width:150px;height:150px;border:0;border-radius:50%;color:#fff;
  font-size:1.35rem;font-weight:700;cursor:pointer;
  background:linear-gradient(135deg,var(--a),var(--b));
  box-shadow:0 14px 34px rgba(79,70,229,.45);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .15s;
}
#btn:active{transform:scale(.94)}   /* تأثير الضغط */
#btn svg{width:38px;height:38px}
#btn.load svg{animation:bob 1s ease-in-out infinite} /* الدبوس يقفز أثناء التحديد */
@keyframes bob{50%{transform:translateY(-6px)}}

/* ============================================================
   5) بطاقة النتيجة: الخريطة الصغيرة + العنوان + الأزرار
   ============================================================ */
#card{
  display:none; width:100%; background:var(--card);
  backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
  border-radius:20px; padding:12px; box-shadow:0 6px 24px rgba(0,0,0,.12);
}
#card.show{display:block}
#mapbox{position:relative;width:100%;height:150px;border-radius:14px;overflow:hidden;margin-bottom:10px;background:var(--land)}
#mapbox svg{width:100%;height:100%;display:block}
/* شبكة 3×3 من بلاطات الخريطة (كل بلاطة 256 بكسل) */
.tiles{position:absolute;left:50%;top:50%;width:768px;height:768px;display:grid;grid-template-columns:repeat(3,256px)}
.tiles img{width:256px;height:256px;display:block}
.pin{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-100%);color:var(--a);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
/* دائرة الدقة حول الدبوس */
.acc{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);background:rgba(79,70,229,.18);border:1.5px solid var(--a)}
/* إسناد OpenStreetMap — مطلوب بحسب شروط استخدام الخرائط */
.attr{position:absolute;bottom:2px;inset-inline-end:6px;font-size:.6rem;color:#333;background:rgba(255,255,255,.7);padding:0 4px;border-radius:4px}

#addr{margin:0 0 4px;font-size:.98rem;font-weight:600}
#msg{margin:0 0 10px;font-size:.85rem;color:var(--muted)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{
  padding:12px 8px;border-radius:12px;border:0;font-size:.92rem;font-weight:600;
  cursor:pointer;color:#fff;background:var(--a);font-family:inherit;
}
.grid .alt{background:transparent;color:var(--fg);border:1px solid var(--muted)}

/* أزرار «افتح في خريطة» */
.openin{margin-top:12px;font-size:.8rem;color:var(--muted)}
.chips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.chips a{padding:7px 12px;border-radius:999px;background:var(--bg);color:var(--fg);font-size:.8rem;font-weight:600;text-decoration:none;border:1px solid var(--road2)}

.ok{color:var(--ok)!important}
.err{color:var(--err)!important}
</style>
</head>

<body>

<!-- خريطة تزيينية للخلفية (رسم SVG، لا تحتاج إنترنت) -->
<svg id="bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <rect width="400" height="800" fill="var(--land)"/>
  <path d="M-10 560 C80 500 140 620 230 580 S360 500 420 540 L420 640 C340 600 280 690 200 670 S60 600 -10 650Z" fill="var(--water)"/>
  <rect x="30" y="90" width="120" height="90" rx="18" fill="var(--park)"/>
  <rect x="250" y="300" width="110" height="130" rx="22" fill="var(--park)"/>
  <circle cx="90" cy="420" r="46" fill="var(--park)"/>
  <g stroke="var(--road2)" stroke-width="2" fill="none"><path d="M0 60H400M0 200H400M0 260H400M0 340H400M0 460H400M0 740H400"/><path d="M60 0V800M170 0V800M300 0V800M360 0V800"/></g>
  <g stroke="var(--road)" stroke-width="9" stroke-linecap="round" fill="none"><path d="M-10 140L410 180"/><path d="M-10 400C100 380 200 450 410 380"/><path d="M120 -10C140 200 90 500 150 810"/><path d="M250 -10C270 250 330 520 290 810"/></g>
  <g stroke="var(--road)" stroke-width="5" stroke-linecap="round" fill="none"><path d="M-10 300L410 280"/><path d="M-10 700L410 720"/><path d="M210 -10L190 810"/></g>
</svg>

<!-- اختيار اللغة: أضف لغة جديدة بزر هنا + نصوصها في القاموس T بالأسفل -->
<div class="langs" id="langs">
  <button type="button" data-l="ar">عربي</button>
  <button type="button" data-l="en">EN</button>
  <button type="button" data-l="fr">FR</button>
</div>

<main>
  <h1 id="title"></h1>

  <div class="wrap" id="wrap">
    <div class="pulse"></div><div class="pulse two"></div>
    <button id="btn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span id="btnTxt"></span>
    </button>
  </div>

  <!-- تظهر بعد تحديد الموقع -->
  <div id="card">
    <div id="mapbox"></div>
    <p id="addr"></p>
    <p id="msg"></p>
    <div class="grid">
      <button id="share" type="button"></button>
      <button id="copy" class="alt" type="button"></button>
    </div>
    <div class="openin"><span id="openTxt"></span>
      <div class="chips">
        <a id="o-g" target="_blank" rel="noopener">Google</a>
        <a id="o-a" target="_blank" rel="noopener">Apple</a>
        <a id="o-w" target="_blank" rel="noopener">Waze</a>
        <a id="o-x" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </div>
</main>

<script>
/* ============================================================
   1) النصوص واللغات
   لإضافة لغة: أضف مفتاحاً جديداً (مثل tr) بنفس الحقول،
   ثم زراً في قسم .langs بالأعلى.
   ============================================================ */
var T = {
  ar:{dir:'rtl',title:'موقعك يُحدَّد تلقائياً',btn:'أنا هنا',here:'أنا هنا 📍',
      share:'مشاركة',copy:'نسخ رابط',open:'افتح في خريطة:',other:'أخرى',
      busy:'جارٍ تحديد موقعك بدقة…',addrBusy:'جارٍ جلب العنوان…',
      done:'تم نسخ الرابط ✓',made:'الرابط جاهز',acc:'الدقة ±',m:' م',
      nosup:'المتصفح لا يدعم تحديد الموقع',
      denied:'لم يتم السماح بالوصول إلى الموقع. فعّله من الإعدادات.',
      fail:'تعذّر تحديد الموقع، حاول مرة أخرى.',copied:'تم النسخ ✓',cfail:'تعذّر النسخ',sep:'، '},
  en:{dir:'ltr',title:'Your location is detected automatically',btn:"I'm here",here:"I'm here 📍",
      share:'Share',copy:'Copy link',open:'Open in map:',other:'Other',
      busy:'Finding your exact location…',addrBusy:'Looking up address…',
      done:'Link copied ✓',made:'Link ready',acc:'Accuracy ±',m:' m',
      nosup:'Your browser does not support geolocation',
      denied:'Location access was denied. Enable it in settings.',
      fail:'Could not get your location. Try again.',copied:'Copied ✓',cfail:'Copy failed',sep:', '},
  fr:{dir:'ltr',title:'Votre position est détectée automatiquement',btn:'Je suis ici',here:'Je suis ici 📍',
      share:'Partager',copy:'Copier le lien',open:'Ouvrir dans :',other:'Autre',
      busy:'Localisation précise en cours…',addrBusy:'Recherche de l’adresse…',
      done:'Lien copié ✓',made:'Lien prêt',acc:'Précision ±',m:' m',
      nosup:'Votre navigateur ne prend pas en charge la géolocalisation',
      denied:'Accès à la position refusé. Activez-le dans les réglages.',
      fail:'Impossible d’obtenir votre position. Réessayez.',copied:'Copié ✓',cfail:'Échec de la copie',sep:', '}
};

/* اللغة الافتراضية: آخر لغة اختارها المستخدم، وإلا لغة الجهاز، وإلا العربية.
   try/catch لأن التخزين المحلي قد يكون معطلاً في بعض المتصفحات. */
var L = 'ar';
try{
  var saved = localStorage.getItem('lang');
  if(saved && T[saved]) L = saved;
  else { var nav = (navigator.language||'ar').slice(0,2); if(T[nav]) L = nav; }
}catch(e){
  var nav2 = (navigator.language||'ar').slice(0,2); if(T[nav2]) L = nav2;
}

/* ============================================================
   2) المتغيرات العامة ودوال مساعدة
   ============================================================ */
var $ = function(id){ return document.getElementById(id); };
var btn=$('btn'), card=$('card'), msg=$('msg'), addrEl=$('addr');
var pos = null;        // {la, lo, acc} بعد تحديد الموقع
var addr = '';         // العنوان النصي إن توفر
var gUrl='', aUrl='';  // رابط جوجل ورابط آبل
var statusKey = null;  // مفتاح رسالة الحالة الحالية (لإعادة ترجمتها عند تغيير اللغة)

/* اهتزاز خفيف: يعمل على أندرويد، وآيفون لا يدعمه من المتصفح */
function buzz(pattern){ try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){} }

function setMsg(text, cls){
  msg.className = cls || '';
  msg.textContent = text;
  card.classList.add('show');
}

/* عرض رسالة الحالة بلغة المستخدم الحالية */
function renderStatus(){
  if(!statusKey) return;
  var t = T[L];
  if(statusKey==='done' || statusKey==='made'){
    setMsg(t[statusKey] + ' (' + t.acc + pos.acc + t.m + ')', statusKey==='done' ? 'ok' : '');
  }else{
    var isErr = (statusKey==='denied' || statusKey==='fail' || statusKey==='nosup');
    setMsg(t[statusKey], isErr ? 'err' : '');
  }
}

/* نص المشاركة: عبارة + العنوان + رابط جوجل + رابط آبل */
function shareText(){
  return T[L].here + (addr ? '\n' + addr : '') + '\n' + gUrl + '\n' + aUrl;
}

/* بناء روابط الخرائط من الإحداثيات */
function setLinks(){
  var q = pos.la + ',' + pos.lo;
  gUrl = 'https://www.google.com/maps?q=' + q;              // يعمل على كل الأجهزة
  aUrl = 'https://maps.apple.com/?q=' + q;                  // خرائط آبل
  $('o-g').href = gUrl;
  $('o-a').href = aUrl;
  $('o-w').href = 'https://waze.com/ul?ll=' + q + '&navigate=yes'; // Waze مع الملاحة
  $('o-x').href = 'geo:' + q + '?q=' + q;                   // أندرويد: قائمة بكل تطبيقات الخرائط
}

/* تطبيق اللغة على كل عناصر الواجهة */
function applyLang(){
  var t = T[L];
  document.documentElement.lang = L;
  document.documentElement.dir  = t.dir;   // يقلب الاتجاه تلقائياً (RTL/LTR)
  $('title').textContent   = t.title;
  $('btnTxt').textContent  = t.btn;
  $('share').textContent   = t.share;
  $('copy').textContent    = t.copy;
  $('openTxt').textContent = t.open;
  $('o-x').textContent     = t.other;
  var bs = $('langs').children;
  for(var i=0;i<bs.length;i++){ bs[i].className = (bs[i].getAttribute('data-l')===L) ? 'on' : ''; }
  renderStatus();
  if(pos) getAddr();   // أعد جلب العنوان بلغة جديدة
}

/* ============================================================
   3) النسخ والمشاركة
   ============================================================ */
/* طريقة احتياطية للنسخ للمتصفحات القديمة */
function fallbackCopy(text){
  try{
    var a = document.createElement('textarea');
    a.value = text; a.style.position='fixed'; a.style.opacity='0';
    document.body.appendChild(a); a.select();
    var ok = document.execCommand('copy');
    document.body.removeChild(a);
    return ok;
  }catch(e){ return false; }
}
function copyText(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).then(function(){return true}, function(){return fallbackCopy(text)});
    }
  }catch(e){}
  return Promise.resolve(fallbackCopy(text));
}
/* نافذة المشاركة الأصلية للنظام؛ إن لم تتوفر ننسخ النص */
function doShare(){
  if(navigator.share){
    return navigator.share({title:T[L].btn, text:shareText()}).catch(function(){});
  }
  return copyText(shareText());
}

/* ============================================================
   4) العنوان النصي (Reverse Geocoding)
   نستخدم خدمة Nominatim المجانية من OpenStreetMap.
   - مهلة 6 ثوانٍ، وإن فشلت نعرض الإحداثيات بدلاً من العنوان.
   - شروط الاستخدام: استعمال خفيف (طلب واحد لكل ضغطة)، وليس للتطبيقات الضخمة.
   ============================================================ */
function coordsText(){ return pos.la + ', ' + pos.lo; }

function getAddr(){
  addr = '';
  addrEl.textContent = T[L].addrBusy;
  var ctl = null, timer = null;
  try{ ctl = new AbortController(); timer = setTimeout(function(){ ctl.abort(); }, 6000); }catch(e){}
  var url = 'https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18'
          + '&accept-language=' + L + '&lat=' + pos.la + '&lon=' + pos.lo;
  fetch(url, ctl ? {signal:ctl.signal} : {})
    .then(function(r){ return r.json(); })
    .then(function(d){
      clearTimeout(timer);
      var a = (d && d.address) || {};
      // نختار: الشارع، الحي، المدينة (ما يتوفر منها)
      var parts = [ a.road || a.pedestrian, a.neighbourhood || a.suburb, a.city || a.town || a.village || a.state ]
                  .filter(Boolean);
      addr = parts.length ? parts.join(T[L].sep) : ((d && d.display_name) || '');
      addrEl.textContent = addr || coordsText();
    })
    .catch(function(){
      clearTimeout(timer);
      addr = '';
      addrEl.textContent = '📍 ' + coordsText();
    });
}

/* ============================================================
   5) الخريطة الصغيرة
   نحسب رقم البلاطة (tile) من الإحداثيات بصيغة Web Mercator،
   ثم نعرض 3×3 بلاطات حول موقعك من OpenStreetMap.
   إن تعذر تحميلها (بدون إنترنت) نعرض رسماً تزيينياً بدلها.
   ============================================================ */
function drawMap(){
  var box = $('mapbox'), z = 16, la = pos.la, lo = pos.lo, N = Math.pow(2, z);

  // الإحداثيات ← موضع البلاطة (x, y) عند مستوى التقريب z
  var x = (lo + 180) / 360 * N;
  var r = la * Math.PI / 180;
  var y = (1 - Math.log(Math.tan(r) + 1/Math.cos(r)) / Math.PI) / 2 * N;
  var tx = Math.floor(x), ty = Math.floor(y);   // رقم البلاطة المركزية
  var fx = x - tx,        fy = y - ty;          // موضع نقطتك داخل البلاطة (0..1)

  // نصف قطر دائرة الدقة بالبكسل (متر ÷ متر-لكل-بكسل)، مع حدّ أدنى وأعلى
  var mpp = 156543.03 * Math.cos(r) / N;
  var rad = Math.max(10, Math.min(70, pos.acc / mpp));

  var pinSvg = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>';
  var accDiv = '<div class="acc" style="width:'+(rad*2)+'px;height:'+(rad*2)+'px"></div>';

  /* الخريطة التزيينية الاحتياطية */
  function fallback(){
    box.innerHTML =
      '<svg viewBox="0 0 360 150" preserveAspectRatio="xMidYMid slice">'
      + '<rect width="360" height="150" fill="var(--land)"/>'
      + '<path d="M0 110C60 90 120 130 200 108S320 90 360 104V150H0Z" fill="var(--water)"/>'
      + '<rect x="20" y="14" width="90" height="48" rx="12" fill="var(--park)"/>'
      + '<rect x="250" y="20" width="70" height="40" rx="12" fill="var(--park)"/>'
      + '<g stroke="var(--road)" stroke-width="7" stroke-linecap="round" fill="none"><path d="M-5 70L365 58"/><path d="M120 -5L140 155"/><path d="M250 -5L230 155"/></g>'
      + '</svg>' + accDiv + '<div class="pin">' + pinSvg + '</div>';
  }

  fallback(); // نعرض الاحتياطية فوراً، ثم نستبدلها إن نجح تحميل الخريطة الحقيقية

  // نجرب تحميل البلاطة المركزية أولاً
  var probe = new Image();
  probe.onload = function(){
    var h = '<div class="tiles" style="transform:translate('
          + (-(256 + fx*256)) + 'px,' + (-(256 + fy*256)) + 'px)">';
    for(var j=-1;j<=1;j++){
      for(var i=-1;i<=1;i++){
        h += '<img alt="" src="https://tile.openstreetmap.org/'+z+'/'+(tx+i)+'/'+(ty+j)+'.png">';
      }
    }
    h += '</div>' + accDiv + '<div class="pin">' + pinSvg + '</div><span class="attr">© OpenStreetMap</span>';
    box.innerHTML = h;
  };
  probe.src = 'https://tile.openstreetmap.org/'+z+'/'+tx+'/'+ty+'.png';
}

/* ============================================================
   6) تحديد الموقع (الدالة الرئيسية)
   fromClick = true عند ضغط المستخدم الزر، فنفتح نافذة المشاركة.
   عند فتح الصفحة تعمل تلقائياً بدون مشاركة (المتصفحات تمنع
   المشاركة بدون لمسة من المستخدم).
   ============================================================ */
function locate(fromClick){
  if(!navigator.geolocation){ statusKey='nosup'; renderStatus(); return; }

  btn.classList.add('load');
  statusKey = 'busy'; renderStatus();

  navigator.geolocation.getCurrentPosition(
    function(p){                                   // نجاح
      btn.classList.remove('load');
      pos = {
        la: p.coords.latitude.toFixed(6),
        lo: p.coords.longitude.toFixed(6),
        acc: Math.round(p.coords.accuracy)         // الدقة بالمتر
      };
      setLinks();
      drawMap();
      getAddr();
      $('wrap').style.transform = 'scale(.8)';     // نصغّر الزر ليفسح المجال للبطاقة
      buzz([30,60,30]);                            // اهتزاز النجاح
      copyText(gUrl).then(function(ok){            // نسخ تلقائي للرابط
        statusKey = ok ? 'done' : 'made';
        renderStatus();
        if(fromClick) doShare();                   // مشاركة تلقائية عند الضغط
      });
    },
    function(e){                                   // فشل
      btn.classList.remove('load');
      buzz(200);                                   // اهتزاز الخطأ
      statusKey = (e.code === 1) ? 'denied' : 'fail';  // 1 = رفض المستخدم الإذن
      renderStatus();
    },
    {
      enableHighAccuracy: true,   // استخدم GPS الحقيقي لا الشبكة
      timeout: 15000,             // مهلة 15 ثانية
      maximumAge: 0               // لا تستخدم موقعاً قديماً مخزناً
    }
  );
}

/* ============================================================
   7) ربط الأحداث وتشغيل التطبيق
   ============================================================ */
btn.addEventListener('click', function(){ locate(true); });

$('share').addEventListener('click', function(){ if(pos) doShare(); });

$('copy').addEventListener('click', function(){
  if(!pos) return;
  copyText(gUrl).then(function(ok){
    buzz(25);
    setMsg(ok ? T[L].copied : T[L].cfail, ok ? 'ok' : 'err');
  });
});

$('langs').addEventListener('click', function(e){
  var l = e.target.getAttribute && e.target.getAttribute('data-l');
  if(l && T[l]){
    L = l;
    try{ localStorage.setItem('lang', l); }catch(x){}
    applyLang();
  }
});

applyLang();     // اضبط اللغة والنصوص
locate(false);   // حدد الموقع تلقائياً عند فتح الصفحة
</script>
